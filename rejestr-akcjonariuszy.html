<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Rejestr Akcjonariuszy PSA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
      body { background: #0f172a; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <!-- Root -->
    <div id="root"></div>

    <!-- React + ReactDOM CDN (latest) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <!-- Babel Standalone for JSX/TSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- TypeScript Plugin for Babel -->
    <script src="https://unpkg.com/@babel/plugin-transform-typescript/lib/index.js"></script>

    <!-- MAIN APP SCRIPT -->
    <script type="text/babel" data-type="module" data-plugins="transform-typescript">
      // --- Data & Icons ---
      const docTemplates = [
        {
          id: 1, icon: "fa-scroll", emoji: "📜", name: "Uchwała emisji akcji",
          desc: "Wzór uchwały o emisji nowych akcji w PSA.",
          category: "Uchwały"
        },
        {
          id: 2, icon: "fa-pen-to-square", emoji: "📝", name: "Uchwała zmiany statutu",
          desc: "Wzór uchwały zmieniającej statut spółki.",
          category: "Uchwały"
        },
        {
          id: 3, icon: "fa-sack-dollar", emoji: "💰", name: "Uchwała podziału zysku",
          desc: "Wzór uchwały dotyczącej podziału zysku.",
          category: "Uchwały"
        },
        {
          id: 4, icon: "fa-clipboard", emoji: "📋", name: "Protokół z WZA",
          desc: "Protokół z Walnego Zgromadzenia Akcjonariuszy.",
          category: "Protokoły"
        },
        {
          id: 5, icon: "fa-file-alt", emoji: "📄", name: "Protokół zarządu",
          desc: "Protokół z posiedzenia zarządu PSA.",
          category: "Protokoły"
        },
        {
          id: 6, icon: "fa-handshake", emoji: "🤝", name: "Umowa zbycia akcji",
          desc: "Wzór umowy zbycia akcji PSA.",
          category: "Umowy"
        },
        {
          id: 7, icon: "fa-lock", emoji: "🔒", name: "Umowa lock-up",
          desc: "Wzór umowy ograniczającej sprzedaż akcji.",
          category: "Umowy"
        },
        {
          id: 8, icon: "fa-house", emoji: "🏠", name: "Umowa użyczenia lokalu",
          desc: "Wzór umowy użyczenia lokalu dla PSA.",
          category: "Umowy"
        },
        {
          id: 9, icon: "fa-chart-bar", emoji: "📊", name: "Raport cap table",
          desc: "Szablon raportu dotyczącego struktury kapitałowej.",
          category: "Raporty"
        },
        {
          id: 10, icon: "fa-book", emoji: "📖", name: "Statut PSA",
          desc: "Wzór statutu prostej spółki akcyjnej.",
          category: "Raporty"
        },
      ];

      // --- Sidebar items ---
      const sidebarItems = [
        { name: "Dashboard",         icon: "fa-gauge"     },
        { name: "Cap Table",         icon: "fa-layer-group"},
        { name: "Emisje",            icon: "fa-coins" },
        { name: "Transakcje",        icon: "fa-arrow-right-arrow-left" },
        { name: "WZA/Głosowania",    icon: "fa-users-between-lines" },
        { name: "Dokumenty",         icon: "fa-folder-open" },
        { name: "Wzory dokumentów",  icon: "fa-file-invoice" , highlight: true },
        { name: "KYC/AML",           icon: "fa-shield" },
        { name: "Audyt",             icon: "fa-magnifying-glass" },
        { name: "Ustawienia",        icon: "fa-gear" },
      ];

      // --- Mock Data ---
      const companyMock = {
        NAZWA_SPOLKI: "TechStart PSA",
        NIP: "1234567890",
        KRS: "0000123456",
        Akcjonariusze: 4,
        Akcje: 10000,
        Kapital: 10000
      };

      // ------- Helpers -------
      function classNames(...arr) {
        return arr.filter(Boolean).join(" ");
      }

      // --- Sidebar Component ---
      function Sidebar({ current, setCurrent }) {
        return (
          <nav className="fixed inset-y-0 left-0 w-64 bg-slate-800 flex flex-col text-slate-100 z-10 transition-all">
            <div className="flex items-center gap-3 h-20 px-6 border-b-2 border-slate-700 font-bold text-2xl tracking-tight">
              <span className="text-blue-400"><i className="fa-solid fa-building-columns"></i></span>
              Rejestr PSA
            </div>
            <ul className="flex-1 py-6 space-y-1">
              {sidebarItems.map((item, i) => (
                <li key={i}>
                  <a
                    onClick={() => setCurrent(item.name)}
                    className={classNames(
                      "flex items-center gap-4 px-6 py-3 rounded-lg cursor-pointer group transition",
                      item.highlight
                        ? "text-blue-400"
                        : "hover:bg-slate-700 hover:text-blue-400",
                      current === item.name && "bg-slate-700 !text-blue-400"
                    )}
                  >
                    <i className={`fa-solid ${item.icon} text-lg w-6`}></i>
                    {item.name}
                  </a>
                </li>
              ))}
            </ul>
            <div className="px-6 py-4 text-xs text-slate-400 border-t border-slate-700">
              © {new Date().getFullYear()} TechStart PSA.<br />All rights reserved.
            </div>
          </nav>
        );
      }

      // --- Grid of Templates ---
      function TemplatesGrid({ templates, filter, onSelect }) {
        const filtered = filter && filter !== "Wszystkie"
          ? templates.filter(t => t.category === filter)
          : templates;
        return (
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            {filtered.map(temp => (
              <div
                key={temp.id}
                className="bg-slate-800 hover:bg-slate-700 rounded-xl p-6 flex flex-col items-center shadow-lg transition group"
              >
                <div className="w-16 h-16 bg-slate-700 mb-4 rounded-full flex items-center justify-center text-3xl">
                  <span>{temp.emoji}</span>
                </div>
                <div className="text-lg font-bold mb-1">{temp.name}</div>
                <div className="text-sm mb-2 text-slate-300 text-center">{temp.desc}</div>
                <span className="inline-block text-xs bg-blue-600 rounded px-2 py-0.5 text-white mb-2">
                  {temp.category}
                </span>
                <button
                  className="mt-auto px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 transition text-sm font-semibold w-full"
                  onClick={() => onSelect(temp)}
                >
                  <i className="fa-solid fa-file-circle-plus mr-2"></i>
                  Użyj wzoru
                </button>
              </div>
            ))}
          </div>
        );
      }

      // --- Filters ---
      const docCategories = ["Wszystkie", "Uchwały", "Protokoły", "Umowy", "Raporty"];
      function TemplatesFilters({ filter, setFilter }) {
        return (
          <div className="flex gap-2 mb-8 flex-wrap">
            {docCategories.map(cat => (
              <button key={cat}
                className={classNames(
                  "px-4 py-1 rounded-full text-sm font-semibold transition",
                  filter === cat
                    ? "bg-blue-600 text-white"
                    : "bg-slate-700 text-slate-300 hover:bg-slate-600"
                )}
                onClick={() => setFilter(cat)}
              >
                {cat}
              </button>
            ))}
          </div>
        );
      }

      // ---- DOC TEMPLATES ----
      // Only template with full logic for live-edit: id=1 (Uchwała emisji akcji)
      const docTemplatesDetails = {
        1: {
          fields: [
            {key:"NAZWA_SPOLKI", label:"Nazwa spółki", type:"text", required:true, placeholder:"TechStart PSA" },
            {key:"NIP", label:"NIP", type:"text", required:true, placeholder:"1234567890" },
            {key:"KRS", label:"KRS", type:"text", required:true, placeholder:"0000123456" },
            {key:"NUMER_UCHWALY", label:"Numer uchwały", type:"text", required:true, placeholder:"1/2025" },
            {key:"DATA_WZA", label:"Data WZA", type:"date", required:true },
            {key:"SERIA_AKCJI", label:"Seria akcji", type:"text", required:true, placeholder:"A" },
            {key:"LICZBA_AKCJI", label:"Liczba akcji", type:"number", required:true, placeholder:"1000" },
            {key:"WARTOSC_NOMINALNA", label:"Wartość nominalna akcji (PLN)", type:"number", required:true, placeholder:"1" },
            {key:"CENA_EMISYJNA", label:"Cena emisyjna akcji (PLN)", type:"number", required:true, placeholder:"1.1" },
            {key:"KWOTA_PODWYZSZENIA", label:"Kwota podwyższenia kapitału (PLN)", type:"number", required:true, readonly:true },
            {key:"PRZEWODNICZACY_WZA", label:"Przewodniczący WZA", type:"text", required:true, placeholder:"Jan Kowalski" },
            {key:"PROTOKOLANT", label:"Protokolant", type:"text", required:true, placeholder:"Anna Nowak" },
          ],
          autofill: {
            NAZWA_SPOLKI: "TechStart PSA",
            NIP: "1234567890",
            KRS: "0000123456",
            NUMER_UCHWALY: "1/2025",
            DATA_WZA: new Date().toISOString().slice(0,10),
            SERIA_AKCJI: "A",
            LICZBA_AKCJI: 1000,
            WARTOSC_NOMINALNA: 1,
            CENA_EMISYJNA: 1.1,
            KWOTA_PODWYZSZENIA: 1000,
            PRZEWODNICZACY_WZA: "Jan Kowalski",
            PROTOKOLANT: "Anna Nowak",
          },
          // HTML for preview - variables are {{XYZ}}
          preview: ({
            NAZWA_SPOLKI = "", NIP = "", KRS = "", NUMER_UCHWALY = "",
            DATA_WZA = "", SERIA_AKCJI = "", LICZBA_AKCJI = "",
            WARTOSC_NOMINALNA = "", CENA_EMISYJNA = "", KWOTA_PODWYZSZENIA = "",
            PRZEWODNICZACY_WZA = "", PROTOKOLANT = ""
          }) => `
<div class="document bg-white text-gray-900 p-16 max-w-[210mm] mx-auto shadow-2xl">
  <header class="text-center border-b-2 pb-6 mb-8">
    <div class="w-24 h-24 bg-blue-600 rounded-full mx-auto mb-4 flex items-center justify-center">
      <span class="text-white text-4xl">🏦</span>
    </div>
    <h1 class="text-2xl font-bold">${NAZWA_SPOLKI}</h1>
    <p class="text-sm text-gray-600">NIP: ${NIP} | KRS: ${KRS}</p>
  </header>
  <main class="space-y-6">
    <div class="text-center">
      <h2 class="text-xl font-bold">UCHWAŁA NR ${NUMER_UCHWALY}</h2>
      <p>Walnego Zgromadzenia Akcjonariuszy</p>
      <p class="text-sm text-gray-600">z dnia ${DATA_WZA}</p>
    </div>
    <h3 class="text-lg font-semibold mt-8">w sprawie: emisji nowych akcji serii ${SERIA_AKCJI}</h3>
    <div class="space-y-4">
      <div>
        <h4 class="font-semibold">§ 1</h4>
        <p>Walne Zgromadzenie Akcjonariuszy postanawia podwyższyć kapitał zakładowy spółki o kwotę <strong>${KWOTA_PODWYZSZENIA} PLN</strong> poprzez emisję <strong>${LICZBA_AKCJI}</strong> akcji zwykłych na okaziciela serii <strong>${SERIA_AKCJI}</strong> o wartości nominalnej <strong>${WARTOSC_NOMINALNA} PLN</strong> każda.</p>
      </div>
      <div>
        <h4 class="font-semibold">§ 2</h4>
        <p>Cena emisyjna jednej akcji serii ${SERIA_AKCJI} wynosi <strong>${CENA_EMISYJNA} PLN</strong>.</p>
      </div>
      <div>
        <h4 class="font-semibold">§ 3</h4>
        <p>Akcje serii ${SERIA_AKCJI} zostaną objęte w drodze subskrypcji prywatnej przez inwestorów wskazanych przez Zarząd Spółki.</p>
      </div>
      <div>
        <h4 class="font-semibold">§ 4</h4>
        <p>Uchwała wchodzi w życie z dniem podjęcia.</p>
      </div>
    </div>
  </main>
  <footer class="mt-16 pt-8 border-t-2">
    <div class="grid grid-cols-2 gap-8">
      <div class="text-center">
        <div class="border-t-2 border-gray-400 pt-2 mt-12">
          <p class="font-semibold">${PRZEWODNICZACY_WZA}</p>
          <p class="text-sm text-gray-600">Przewodniczący WZA</p>
        </div>
      </div>
      <div class="text-center">
        <div class="border-t-2 border-gray-400 pt-2 mt-12">
          <p class="font-semibold">${PROTOKOLANT}</p>
          <p class="text-sm text-gray-600">Protokolant</p>
        </div>
      </div>
    </div>
  </footer>
</div>
          `
        }
      };

      // --- DocEditor for full template 1 logic ---
      function DocEditor({ template, onBack }) {
        const tdata = docTemplatesDetails[template.id];
        const [form, setForm] = React.useState({ ...tdata.autofill });
        const [logo, setLogo] = React.useState(null); // For logo upload
        const [touched, setTouched] = React.useState({});
        // Calculate KWOTA_PODWYZSZENIA automatically
        React.useEffect(() => {
          if (
            form.LICZBA_AKCJI && form.WARTOSC_NOMINALNA &&
            !touched["KWOTA_PODWYZSZENIA"]
          ) {
            const val = Number(form.LICZBA_AKCJI) * Number(form.WARTOSC_NOMINALNA);
            setForm(f => ({ ...f, KWOTA_PODWYZSZENIA: val || "" }));
          }
        }, [form.LICZBA_AKCJI, form.WARTOSC_NOMINALNA]);
        function onInput(e, field) {
          let v = e.target.value;
          setForm(old => ({ ...old, [field.key]: v }));
          setTouched(old => ({ ...old, [field.key]: true }));
        }
        function autofill() {
          setForm({ ...tdata.autofill });
        }
        function exportPDF() {
          alert("To jest tylko wersja demonstracyjna. Funkcja zapisu PDF jest symulowana.");
        }
        function onLogoUpload(e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = e2 => setLogo(e2.target.result);
            reader.readAsDataURL(file);
          }
        }
        function closeEditor() {
          if (window.confirm("Na pewno opuścić edytor? Niezapisane dane zostaną utracone.")) onBack();
        }
        // Validate
        function invalid(f) {
          return tdata.fields.filter(x => x.required && !form[x.key]).map(x => x.key);
        }
        const invalids = invalid(form);

        // Responsive - on small screens show tabs instead of split screen
        const isMobile = window.innerWidth < 768;

        // --- FORM FIELDS ---
        function FormFields() {
          return (<>
            {tdata.fields.map(field => (
              <div key={field.key} className="mb-4">
                <label className="text-sm font-semibold block mb-1">{field.label}</label>
                <input
                  type={field.type}
                  className={classNames(
                    "w-full px-3 py-2 rounded border bg-slate-900 text-slate-100 outline-none transition",
                    field.readonly ? "bg-slate-700 cursor-not-allowed" : "",
                    invalids.includes(field.key) ? "border-red-500" : "border-slate-700"
                  )}
                  value={form[field.key] ?? ""}
                  onChange={e => onInput(e, field)}
                  readOnly={!!field.readonly}
                  placeholder={field.placeholder || ""}
                  required={field.required}
                />
              </div>
            ))}
            <button type="button"
              className="w-full px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 mt-2 font-semibold"
              onClick={autofill}
            >
              <i className="fa-solid fa-magic mr-2"></i>
              Wypełnij przykładowymi danymi
            </button>
          </>);
        }

        // --- DOC PREVIEW ---
        function DocPreview() {
          // Inject logo (if uploaded)
          let html = tdata.preview(form);
          if (logo) {
            html = html.replace(
              /<div class="w-24 h-24[^"]*">(?:.|\n)*?<\/div>/,
              `<div class="w-24 h-24 bg-cover bg-center bg-blue-200 rounded-full mx-auto mb-4 flex items-center justify-center" style="background-image:url('${logo}')"></div>`
            );
          }
          return (
            <div className="bg-gradient-to-br from-gray-50 to-gray-200 rounded-lg shadow-lg overflow-auto"
              style={{ minHeight: "800px", maxHeight: "1200px" }}>
              <div dangerouslySetInnerHTML={{ __html: html }} />
            </div>
          );
        }

        // --- TOOLBAR ---
        function Toolbar() {
          return (
            <div className="flex gap-2 flex-wrap items-center mb-6">
              <label className="flex items-center">
                <i className="fa-solid fa-upload mr-2 text-blue-600"></i>
                <span className="hidden md:inline">Dodaj logo</span>
                <input type="file" className="hidden" accept="image/*" onChange={onLogoUpload} />
              </label>
              <button className="px-4 py-1.5 bg-blue-600 rounded hover:bg-blue-700 font-semibold"
                onClick={exportPDF}>
                <i className="fa-solid fa-file-arrow-down mr-2"></i> Eksport PDF
              </button>
              <button className="px-4 py-1.5 bg-slate-700 rounded hover:bg-slate-600 font-semibold"
                onClick={() => alert("Dane zostały zapisane (symulacja)")}>
                <i className="fa-solid fa-floppy-disk mr-2"></i> Zapisz
              </button>
              <button className="ml-auto px-4 py-1.5 bg-red-600 rounded hover:bg-red-700 font-semibold"
                onClick={closeEditor}>
                <i className="fa-solid fa-xmark mr-2"></i> Zamknij
              </button>
            </div>
          );
        }

        // --- Responsive Tabs (mobile) ---
        const [tab, setTab] = React.useState("form");
        if (isMobile) {
          return (
            <div className="w-full">
              <Toolbar />
              <div className="flex gap-2 mb-2">
                <button className={classNames("flex-1 py-2 rounded font-semibold", tab === "form" ? "bg-blue-600" : "bg-slate-700")} onClick={() => setTab("form")}>Formularz</button>
                <button className={classNames("flex-1 py-2 rounded font-semibold", tab === "preview" ? "bg-blue-600" : "bg-slate-700")} onClick={() => setTab("preview")}>Podgląd</button>
              </div>
              <div>{tab === "form" ? <FormFields /> : <DocPreview />}</div>
            </div>
          );
        }

        // --- SPLIT SCREEN (DESKTOP) ---
        return (
          <div className="flex gap-8">
            <div className="w-2/5 min-w-[340px]">
              <Toolbar />
              <FormFields />
            </div>
            <div className="w-3/5">
              <div className="sticky top-8"><DocPreview /></div>
            </div>
          </div>
        );
      }

      // --- Main Layout ---
      function App() {
        // State: sidebar, which main module, etc.
        const [active, setActive] = React.useState("Wzory dokumentów");
        const [filter, setFilter] = React.useState("Wszystkie");
        const [activeTemplate, setActiveTemplate] = React.useState(null);

        // ---- Wzory dokumentów (main view) ----
        function WzoryDokumentow() {
          if (activeTemplate) {
            // Show split-screen doc editor
            if (activeTemplate.id===1)
              return (
                <DocEditor template={activeTemplate} onBack={()=>setActiveTemplate(null)} />
              );
            // Prosty placeholder dla innych typów
            return (
              <div className="max-w-xl mx-auto bg-slate-800 rounded-lg p-8 text-center flex flex-col items-center">
                <i className={`fa-solid ${activeTemplate.icon} text-6xl mb-4 text-blue-400`}></i>
                <h2 className="font-bold text-2xl mb-2">{activeTemplate.name}</h2>
                <p className="mb-8">{activeTemplate.desc}</p>
                <p className="text-slate-400 mb-12">Edytor tego dokumentu zostanie udostępniony w kolejnej wersji.</p>
                <button className="px-6 py-2 rounded bg-blue-600 hover:bg-blue-700 font-semibold"
                        onClick={()=>setActiveTemplate(null)}>
                  <i className="fa-solid fa-arrow-left mr-2"></i> Wróć do wzorów
                </button>
              </div>
            )
          }
          return (
            <div>
              <h1 className="text-3xl font-bold mb-2">📄 Wzory dokumentów</h1>
              <p className="mb-6 text-slate-400">
                Przykładowe formularze, uchwały, protokoły i umowy wykorzystywane w PSA. Wybierz wzór, dostosuj i pobierz!
              </p>
              <TemplatesFilters filter={filter} setFilter={setFilter} />
              <TemplatesGrid templates={docTemplates} filter={filter} onSelect={setActiveTemplate} />
            </div>
          );
        }

        // --- placeholder views for other modules ---
        function PlaceholderView({ icon, name }) {
          return (
            <div className="max-w-xl mx-auto bg-slate-800 rounded-lg p-8 text-center mt-16 flex flex-col items-center">
              <i className={`fa-solid ${icon} text-6xl mb-4 text-blue-400`}></i>
              <h2 className="font-bold text-2xl mb-2">{name}</h2>
              <span className="text-slate-400">Ten moduł zostanie udostępniony w przyszłości.</span>
            </div>
          )
        }

        function MainContent() {
          if (active === "Wzory dokumentów") return <WzoryDokumentow />;
          const mod = sidebarItems.find(x => x.name === active);
          return <PlaceholderView icon={mod.icon} name={mod.name} />;
        }

        return (
          <div className="flex min-h-screen">
            <Sidebar current={active} setCurrent={setActive} />
            <main className="flex-1 ml-64 px-6 py-12 transition">
              <MainContent />
            </main>
          </div>
        );
      }

      // ---- RENDER ----
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
  </body>
</html>
